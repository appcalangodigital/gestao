<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preload" as="image" href="banner.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calango Digital</title>
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#0a2350;--mut:#5a6b8c;--pri:#0f4fa8;--sky:#3b9be8;--on:#fff;--line:#d5e3f7;--ok:#1f7a4d;--err:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;max-width:100%}
html,body{touch-action:pan-y pinch-zoom;overscroll-behavior-x:none}
body{overflow-x:hidden;overflow-x:clip;max-width:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{width:100%;max-width:520px;margin:0 auto;padding:18px max(22px,env(safe-area-inset-left)) 40px max(22px,env(safe-area-inset-left))}
.back{display:inline-flex;align-items:center;gap:6px;background:#eaf1fc;border:0;color:var(--pri);font:700 .95rem system-ui,sans-serif;padding:9px 16px;border-radius:999px;cursor:pointer;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:360px;margin:0 auto}
.welcome{text-align:center;margin:0 0 20px}
.welcome img{display:block;width:calc(100% + 44px);max-width:none;height:auto;margin:6px -22px 2px}
.welcome b{display:block;font-size:1.25rem;margin-top:4px;color:#0a2350}
.welcome span{font-size:.95rem;color:#5a6b8c}
.tile{min-width:0;border:0;border-radius:20px;padding:16px 8px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:700 .9rem/1.2 system-ui,sans-serif;text-align:center;overflow-wrap:anywhere;cursor:pointer;color:#fff;background:linear-gradient(145deg,#0e2a60,#1760c4);box-shadow:0 6px 16px rgba(15,79,168,.28)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:1.8rem;line-height:1}
.tile.soon .ic{filter:grayscale(1);opacity:.55}
.tile.soon{background:#eef3fb;color:#7d8da9;box-shadow:none;cursor:default}
.tile.soon .lg{width:64px;height:64px;object-fit:contain;mix-blend-mode:multiply;opacity:.85}
.tile.soon .eb{font-size:.72rem;letter-spacing:.14em;font-weight:800;color:#7d8da9}
.tile small{font-weight:500;font-size:.7rem;opacity:.85;margin-top:-3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:1.45rem;font-weight:800;margin:6px 0 16px;color:#0a2f7a;letter-spacing:-.2px}
video{width:100%;border-radius:12px;background:#000;display:none;aspect-ratio:4/3;object-fit:cover}
button.b{border:0;border-radius:14px;padding:15px;font:600 1rem system-ui,sans-serif;cursor:pointer;background:var(--pri);color:var(--on)}
button.b.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}
button.wide{width:100%;margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
#last{min-height:24px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.info{flex:1;min-width:0}
.nm{font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--mut);font-size:.85rem;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;padding:0;font-size:1.4rem}
.qty b{min-width:34px;text-align:center;font-size:1.3rem;color:var(--sky)}
.ed{background:none;border:0;color:var(--pri);padding:2px 0;font-size:.85rem;text-decoration:underline;cursor:pointer}
.ac{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:2px}
.qty .qn{min-width:40px;background:none;border:0;font:700 1.3rem system-ui,sans-serif;color:var(--sky);cursor:pointer}
.item.zero{opacity:.55}
.uni{display:inline-block;margin:-4px 0 12px;padding:3px 12px;border-radius:999px;background:#e8f0fe;color:#0f4fa8;font-size:.8rem;font-weight:700}
.unid{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;padding:12px;border:2px solid var(--pri);border-radius:14px;background:#fff;color:var(--pri);font:700 1rem system-ui,sans-serif;cursor:pointer}
.st{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;background:#8a8f99}
.st.v{background:#b3261e}.st.a{background:#e08a00}.st.o{background:#1f7a4d}.st.n{background:#6b7a99}
.tot{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.ok{color:var(--ok)}.err{color:var(--err)}.mut{color:var(--mut)}
.dif{font-weight:700;text-align:right;min-width:92px}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}.tb th,.tb td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left;overflow-wrap:anywhere}
#print{display:none}
@media print{main{display:none!important}body{background:#fff}#print{display:block;color:#000;padding:12px}#print .tb th,#print .tb td{border-color:#999}}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--mut);font-size:.9rem}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,35,80,.45);display:flex;align-items:center;justify-content:center;padding:22px;animation:fd .15s ease-out}
@keyframes fd{from{opacity:0}to{opacity:1}}
.dlg{width:100%;max-width:340px;background:#fff;border-radius:24px;padding:22px 20px 18px;box-shadow:0 18px 50px rgba(10,35,80,.35);color:var(--ink)}
.dlg h3{margin:0 0 4px;font-size:1.25rem;font-weight:800;color:#0a2f7a}
.dlg .dsub{font-weight:700;color:var(--mut);margin-bottom:12px;overflow-wrap:anywhere}
.dlg p{margin:6px 0 12px;color:var(--mut);font-size:.95rem}
.dlg label.fl{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin:12px 0 0}
.dlg input,.dlg select,.dlg textarea{display:block;width:100%;margin-top:5px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#f6f9ff;color:var(--ink);font:600 1rem system-ui,sans-serif;outline:none}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--pri);background:#fff}
.dlg .qs{display:flex;gap:10px;align-items:center;margin-top:6px}
.dlg .qs input{margin:0;text-align:center;font-size:1.6rem;font-weight:800;color:var(--pri);padding:10px 6px}
.dlg .qs button{flex:0 0 52px;height:52px;padding:0;font-size:1.6rem;border-radius:16px}
.dlg details{margin-top:14px}
.dlg summary{cursor:pointer;color:var(--pri);font-weight:700;font-size:.9rem;padding:4px 0}
.dbt{display:flex;gap:10px;margin-top:20px}
.dbt button{flex:1;padding:14px 8px;border-radius:14px}
.dbt button.b:not(.alt){background:linear-gradient(145deg,#0e2a60,#1760c4)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#0e2a60;color:#fff;padding:12px 20px;border-radius:999px;font:600 .95rem system-ui,sans-serif;box-shadow:0 8px 24px rgba(10,35,80,.3);max-width:88%;text-align:center}
.dlg{max-height:88vh;overflow-y:auto}
.dlg textarea{resize:none}
.dlg select{appearance:auto}
.r2{display:flex;gap:10px}.r2>*{flex:1;min-width:0}
.dlg .r2 input,.dlg .r2 select{font-size:.88rem;padding:13px 8px}
.dlg input[type=date],.dlg input[type=time]{min-width:0}
.acs{display:flex;gap:10px;margin-top:16px}.acs button{flex:1;padding:12px 6px;border-radius:14px}
.pc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(10,35,80,.07);cursor:pointer;color:var(--ink);font-family:inherit}
.pc .pn{font-weight:800;font-size:1.05rem;color:#0a2f7a}.pc .ps{color:var(--mut);font-size:.88rem}.pc .pm{margin-top:6px;font-size:.92rem}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}
.wd{border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-family:inherit;cursor:pointer;min-width:0}
.wd small{font-size:.68rem;color:var(--mut)}.wd b{font-size:1rem}.wd i{font-style:normal;font-size:.68rem;font-weight:700;color:var(--pri);min-height:.95em}
.wd.on{background:linear-gradient(145deg,#0e2a60,#1760c4);border-color:transparent;color:#fff}.wd.on small,.wd.on i{color:#cfe3ff}
.wd.td:not(.on){border-color:var(--pri)}
.dn{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dn .dt{flex:1;text-align:center;font-weight:800;color:#0a2f7a}
.nv{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:0;background:#eaf1fc;color:var(--pri);font-size:1.5rem;cursor:pointer}
.ap{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:0 2px 8px rgba(10,35,80,.06)}
.ap .ah{display:flex;flex-direction:column;align-items:center;min-width:52px}.ap .ah b{font-size:1.05rem;color:#0a2f7a}.ap .ah span{font-size:.75rem;color:var(--mut)}
.ap .ai{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ch{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px}
.ch.pg{background:#1f7a4d}.ch.pd{background:#e07b1a}
.rw{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.sl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f4f8ff;border:1.5px dashed #b9cff0;border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;color:var(--pri);font-family:inherit}
.sl b{font-size:1.05rem;color:#0a2f7a;min-width:52px;text-align:center}.sl span{font-weight:700;font-size:.9rem}
.info{font-size:.85rem;color:var(--mut);text-align:center;margin:0 0 12px}
.dlg .hr{display:flex;align-items:center;gap:6px;margin-top:8px}
.dlg .hr span{font-size:.85rem;color:var(--mut)}
.dlg .hr input[type=time]{flex:1;min-width:0;margin:0;padding:10px 6px;font-size:.9rem;text-align:center}
.dlg .hr label.ck{display:flex;align-items:center;gap:7px;flex:0 0 66px;margin:0;font-weight:700;font-size:.9rem;color:var(--ink)}
.dlg input[type=checkbox]{display:inline-block;width:20px;height:20px;margin:0;padding:0;accent-color:#1760c4}
.agst{font-size:.8rem;text-align:center;padding:10px 4px 2px;cursor:pointer;color:var(--mut)}
.agst.ok{color:#1f7a4d}.agst.err{color:#b3261e}
.tile{position:relative}
.bd{position:absolute;top:8px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#e53935;color:#fff;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.item.v{box-shadow:inset 4px 0 0 #b3261e;padding-left:10px}
.item.a{box-shadow:inset 4px 0 0 #e08a00;padding-left:10px}
.nm.v{color:#b3261e}.nm.a{color:#b86e00}
#fa{font-size:.88rem;gap:4px 8px}#fa span{white-space:nowrap}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>

<script>
/* ===== Módulos: para incluir um novo botão na tela inicial, adicione um item aqui ===== */
const MODULES=[
  {id:'estoque',titulo:'Estoque',icone:'📦',abrir:()=>abrirEstoque()},
  {id:'agendas',titulo:'Agendas',icone:'🗓️',abrir:()=>abrirAgendas()},
  {id:'documentos',titulo:'Documentos',icone:'📁',abrir:()=>abrirDocs()},
  {id:'financeiro',titulo:'Financeiro',icone:'💲',abrir:()=>abrirFin()}
];
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem('calango:'+k))||d}catch(e){return d}},set(k,v){try{localStorage.setItem('calango:'+k,JSON.stringify(v))}catch(e){}}};
/* ===== Unidades: a Matriz usa as chaves de sempre; as outras ganham o id da unidade ===== */
const U=()=>store.get('unidade','matriz');
const kU=k=>U()==='matriz'?k:k+'@'+U();
let limpar=null,voltaAtual=null,porVoltar=false,agRe=null;
/* janelas (caixas) abertas: o botão voltar do celular fecha a de cima, como o botão Cancelar */
const dlgPilha=[];let dlgEntrada=false,dlgIgnorar=0;
function dlgAbre(reg){if(!dlgEntrada){history.pushState({dlg:1},'');dlgEntrada=true}dlgPilha.push(reg)}
function dlgFecha(reg){
  const i=dlgPilha.indexOf(reg);if(i>=0)dlgPilha.splice(i,1);
  if(!dlgPilha.length)setTimeout(()=>{if(!dlgPilha.length&&dlgEntrada){dlgEntrada=false;dlgIgnorar++;history.back()}},0);
}

const EM_BREVE=[1];
function inicio(){
  if(limpar){limpar();limpar=null}
  voltaAtual=null;
  app.innerHTML='<div class="welcome"><img src="banner.png" alt="Calango Digital" width="1000" height="533" fetchpriority="high" decoding="async"><b>Bem-vindo(a)!</b><span>Seus serviços organizados em um só lugar.</span></div>'+
    '<button class="unid" id="un">📍 <span id="unn">'+esc(unidAtual().nome)+'</span> <span>▾</span></button>'+
    '<div class="grid">'+MODULES.map(m=>'<button class="tile" data-m="'+m.id+'"><span class="ic">'+m.icone+'</span>'+esc(m.titulo)+'</button>').join('')+
    EM_BREVE.map(()=>'<div class="tile soon"><img class="lg" src="icon-192.png" alt="" width="64" height="64"><b class="eb">EM BREVE</b></div>').join('')+'</div>';
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>MODULES.find(m=>m.id===b.dataset.m).abrir());
  $('un').onclick=escolherUnid;
  const nAl=finAlertas(),tf=app.querySelector('[data-m="financeiro"]');
  if(nAl&&tf)tf.insertAdjacentHTML('beforeend','<span class="bd">'+nAl+'</span>');
  if(store.get('planilha',{}).token)unidades.sync().then(()=>{const e=$('unn');if(e)e.textContent=unidAtual().nome});
}
function telaModulo(t,html,volta){
  agRe=null;
  if(limpar){limpar();limpar=null}
  voltaAtual=volta||inicio;
  if(!porVoltar)history.pushState({t:1},'');
  app.innerHTML='<button class="back" id="voltar">‹ Voltar</button><h2>'+esc(t)+'</h2><div class="uni">📍 '+esc(unidAtual().nome)+'</div>'+html;
  $('voltar').onclick=()=>history.back();
}
/* botão voltar do celular: volta uma tela do app */
window.addEventListener('popstate',()=>{
  if(dlgIgnorar>0){dlgIgnorar--;return}
  if(dlgPilha.length){
    dlgEntrada=false;dlgPilha[dlgPilha.length-1].cancelar();
    if(dlgPilha.length){history.pushState({dlg:1},'');dlgEntrada=true}
    return;
  }
  if(!voltaAtual)return;
  const f=voltaAtual;porVoltar=true;
  try{f()}finally{porVoltar=false}
});
function menu(t,tiles,volta){
  telaModulo(t,'<div class="grid">'+tiles.map((x,i)=>'<button class="tile" data-i="'+i+'"><span class="ic">'+x.ic+'</span>'+esc(x.t)+'</button>').join('')+'</div>',volta);
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=tiles[b.dataset.i].f);
}

/* ===== Ligação com a planilha (Google Sheets via Apps Script) ===== */
/* ===== Caixas de diálogo do app (no lugar das janelas do navegador) ===== */
const campo=(id,rot,val,tipo,extra)=>'<label class="fl">'+esc(rot)+'<input data-f="'+id+'" type="'+(tipo||'text')+'" value="'+esc(val==null?'':val)+'" autocomplete="off" '+(extra||'')+'></label>';
function caixa(o){return new Promise(res=>{
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h3>'+esc(o.titulo)+'</h3>'+(o.sub?'<div class="dsub">'+esc(o.sub)+'</div>':'')+(o.texto?'<p>'+esc(o.texto)+'</p>':'')+(o.html||'')+
    '<div class="dbt">'+(o.semCancelar?'':'<button class="b alt" data-x="0">'+esc(o.cancelar||'Cancelar')+'</button>')+'<button class="b" data-x="1">'+esc(o.ok||'OK')+'</button></div></div>';
  document.body.appendChild(ov);
  let fechado=false;
  const reg={cancelar:()=>fim(o.semCancelar?{}:null)};
  const fim=v=>{if(fechado)return;fechado=true;ov.remove();dlgFecha(reg);res(v)};
  dlgAbre(reg);
  const ler=()=>{const r={};ov.querySelectorAll('[data-f]').forEach(i=>r[i.dataset.f]=i.type==='checkbox'?(i.checked?'1':'0'):i.value);return r};
  ov.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&o.mudou)o.mudou(f,ov)});
  ov.onclick=e=>{
    const ac=e.target.closest('[data-a]');
    if(ac&&o.acao){o.acao(ac.dataset.a,ler,fim);return}
    const st=e.target.closest('[data-st]');
    if(st){const i=ov.querySelector('[data-f="qtd"]');i.value=String(Math.max(0,Math.round(((Number(String(i.value).replace(',','.'))||0)+Number(st.dataset.st))*1000)/1000)).replace('.',',');return}
    const x=e.target.closest('[data-x]');
    if(x)fim(x.dataset.x==='1'?ler():null);
    else if(e.target===ov&&!o.semCancelar)fim(null);
  };
  ov.onkeydown=e=>{
    if(e.key==='Escape'&&!o.semCancelar)fim(null);
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!o.semEnter){e.preventDefault();fim(ler())}
  };
  const f=ov.querySelector('[data-f]');if(f&&!o.semFoco){f.focus();if(f.select)f.select()}
})}
const confirmar=(titulo,texto,ok)=>caixa({titulo,texto,ok:ok||'Confirmar'});
const avisar=(titulo,texto)=>caixa({titulo,texto,ok:'OK',semCancelar:true});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

const URL_PADRAO='https://script.google.com/macros/s/AKfycbz4fD7qep9_cmuIxykk4-bqWJtVVo7zBZPkWI8Tq3t_Q836YiPF7AsJLofPWBb3F1_s/exec';
async function cfg(forcar){
  let c=store.get('planilha',{url:'',token:''});
  c.url=URL_PADRAO;
  if(forcar||!c.token){
    const r=await caixa({titulo:'Senha da planilha',texto:'Digite a mesma senha que você definiu no script.',html:campo('t','Senha',c.token),ok:'Salvar'});
    if(!r)return null;
    c.token=r.t.trim();store.set('planilha',c);
  }
  return c;
}
async function apiGet(p){const c=await cfg();if(!c)throw new Error('config');
  const r=await fetch(c.url+'?'+new URLSearchParams({token:c.token,unid:U(),...p}));return r.json()}
async function apiPost(b){const c=await cfg();if(!c)throw new Error('config');
  const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,unid:U(),...b})});return r.json()}
async function compartilhar(txt){
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){return}
  try{await navigator.clipboard.writeText(txt);toast('Copiado.')}catch(e){await caixa({titulo:'Copie o texto',html:campo('t','Texto',txt),ok:'OK',semCancelar:true})}
}

/* ===== Contagem de estoque ===== */
function abrirContagem(){
  telaModulo('Contagem',
  '<div class="card"><div id="last" class="mut">Carregando a última contagem…</div></div>'+
  '<div class="card"><video id="v" playsinline muted></video>'+
  '<button class="b wide" id="cam" style="margin-top:0">Abrir câmera para ler produto novo</button>'+
  '<div class="row" style="margin-top:8px"><input id="man" type="text" inputmode="numeric" placeholder="Código digitado"><button class="b alt" id="add">Somar</button></div></div>'+
  '<div class="card"><div class="tot"><span>Itens: <span id="n">0</span> · Unidades: <span id="u">0</span></span><span id="mx" class="mut"></span></div>'+
  '<div id="list"></div>'+

  '<button class="ed" id="cfgb" style="margin-top:10px">alterar senha da planilha</button></div>'+
  '<div id="cmp"></div>',abrirEstoque);

  let cat=store.get('catalogo',{}),cnt={},tocados={},base={};

  const TXT_CAM='Abrir câmera para ler produto novo';

  const msg=h=>{$('last').innerHTML=h};
  const agora=()=>new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const num=v=>Math.round((Number(String(v).replace(',','.'))||0)*1000)/1000;
  const fmt=n=>String(n).replace('.',',');
  const comTempo=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('tempo')),ms))]);
  const nome=c=>(cat[c]&&cat[c].name)||c;
  const porNome=(a,b)=>nome(a).localeCompare(nome(b));
  const nomesDe=s=>Object.keys(s).forEach(c=>{if(!cat[c]||!cat[c].name)cat[c]={name:s[c].nome||'',size:s[c].medida||''}});

  function beep(){
    try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.1)}catch(e){}
    if(navigator.vibrate)navigator.vibrate(60);
  }

  /* monta a lista de trabalho: o que você mexeu fica; o que não mexeu acompanha a última contagem salva */
  function reconstruir(manter){
    const t=manter?tocados:{},n={};
    Object.keys(t).forEach(c=>{if(cnt[c]!==undefined)n[c]=cnt[c]});
    Object.keys(base).forEach(c=>{if(!t[c]&&base[c].qtd>0)n[c]=base[c].qtd});
    cnt=n;tocados=t;
  }

  function render(){
    const codes=Object.keys(cnt).sort(porNome);
    $('n').textContent=codes.filter(c=>cnt[c]>0).length;
    $('u').textContent=fmt(Math.round(codes.reduce((s,c)=>s+cnt[c],0)*1000)/1000);
    const sm=Object.keys(base).filter(c=>base[c].qtd>0&&!tocados[c]).length;
    $('mx').textContent=sm?'Sem mexer: '+sm:'';
    $('list').innerHTML=codes.length?codes.map(c=>{
      const p=cat[c]||{},b=base[c]?base[c].qtd:undefined,q=cnt[c];
      let est;
      if(!tocados[c])est='<span class="mut">sem alteração</span>';
      else if(b===undefined)est='<span class="ok">novo</span>';
      else if(q===b)est='<span class="ok">conferido</span>';
      else est='<span class="'+(q>b?'ok':'err')+'">antes '+fmt(b)+'</span>';
      return '<div class="item'+(q===0?' zero':'')+'"><div class="info"><div class="nm">'+esc(p.name||'Produto sem nome')+'</div>'+
        '<div class="sub">'+esc([p.size,c].filter(Boolean).join(' · '))+' · '+est+'</div>'+
        '<div class="ac">'+(tocados[c]?'':'<button class="ed" data-ok="'+c+'">está igual</button>')+'<button class="ed" data-z="'+c+'">zerar</button><button class="ed" data-e="'+c+'">editar nome</button></div></div>'+
        '<div class="qty"><button class="b alt" data-m="'+c+'">−</button><button class="qn" data-q="'+c+'">'+fmt(q)+'</button><button class="b" data-p="'+c+'">+</button></div></div>';
    }).join(''):'<span class="mut">Nenhum produto ainda.</span>';
  }

  async function lookup(c){
    try{
      const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=product_name,quantity');
      const d=await r.json();
      if(d.status===1&&d.product&&d.product.product_name){cat[c]={name:d.product.product_name,size:d.product.quantity||''};save();render()}
    }catch(e){}
  }

  function contar(c){
    c=String(c).replace(/\D/g,'');if(c.length<8)return;
    cnt[c]=num((cnt[c]||0)+1);tocados[c]=1;
    const novo=!cat[c]||!cat[c].name;
    if(!cat[c])cat[c]={name:'',size:''};
    save();render();beep();
    msg('<span class="ok">Lido:</span> '+esc(nome(c))+' (agora '+fmt(cnt[c])+')');
    if(novo)lookup(c);
  }

  /* abre a tela: busca a última contagem salva (ou usa a guardada no celular) */
  async function carregar(){
    let itens=null,quando='',sem=false,recusou=false,semSenha=false;
    try{
      const d=await comTempo(apiGet({action:'saldo'}),9000);
      if(d.ok){itens=d.itens;quando=agora();store.set(kU('ultimoSaldo'),{itens,quando})}
      else{recusou=true;msg('<span class="err">A planilha recusou: '+esc(d.erro||'erro')+'. Confira a senha em “alterar senha da planilha”.</span>')}
    }catch(e){if(e.message==='config')semSenha=true;else sem=true}
    if(!itens){const u=store.get(kU('ultimoSaldo'),null);if(u){itens=u.itens;quando=u.quando}}
    base=itens||{};nomesDe(base);
    const r=store.get(kU('rascunho2'),null);
    cnt=(r&&r.cnt)||{};tocados=(r&&r.tocados)||{};
    reconstruir(true);save();render();
    const tem=Object.keys(base).length>0;
    if(semSenha)msg('<span class="err">Falta a senha da planilha.</span> Toque em “alterar senha da planilha” para carregar a última contagem.');
    else if(sem)msg('<span class="err">Sem internet.</span> '+(tem?'Usando a lista guardada neste celular ('+esc(quando)+'). Você pode ajustar, mas para salvar é preciso internet.':'Não há lista guardada neste celular. Conecte-se para carregar a última contagem.'));
    else if(!recusou)msg(tem?'<span class="ok">Lista da última contagem salva.</span> Ajuste o que mudou e finalize.':'Primeira contagem: leia os produtos para montar o estoque inicial.');
  }

  $('list').onclick=async e=>{
    const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    const mexe=(c,v)=>{cnt[c]=Math.max(0,num(v));tocados[c]=1;save();render()};
    if(d.p)mexe(d.p,cnt[d.p]+1);
    else if(d.m)mexe(d.m,cnt[d.m]-1);
    else if(d.z)mexe(d.z,0);
    else if(d.ok){tocados[d.ok]=1;save();render()}
    else if(d.q){
      const r=await caixa({titulo:'Quantidade',sub:nome(d.q),html:campo('q','Quantidade',fmt(cnt[d.q]),'text','inputmode="decimal"'),ok:'Salvar'});
      if(r)mexe(d.q,r.q);
    }else if(d.e){
      const c=d.e,p=cat[c]||{name:'',size:''};
      const r=await caixa({titulo:'Editar produto',html:campo('n','Nome do produto',p.name)+campo('m','Medida (ex: 500 g)',p.size),ok:'Salvar'});
      if(r){cat[c]={name:r.n.trim(),size:r.m.trim()};save();render()}
    }
  };
  $('add').onclick=()=>{contar($('man').value);$('man').value=''};
  $('reset').onclick=async()=>{
    if(await confirmar('Descartar alterações?','A lista volta para a última contagem salva.','Descartar')){
      cnt={};tocados={};reconstruir(false);save();render();$('cmp').innerHTML='';msg('Alterações descartadas.');
    }
  };
  $('cfgb').onclick=async()=>{if(await cfg(true)){msg('Senha salva. Carregando…');carregar()}};

  $('fim').onclick=async()=>{
    if(!Object.keys(cnt).length){msg('Nenhum item na lista.');return}
    msg('Buscando o estoque salvo…');
    let saldo;
    try{
      const d=await comTempo(apiGet({action:'saldo'}),10000);
      if(!d.ok){msg('<span class="err">A planilha recusou: '+esc(d.erro||'erro')+'. Confira a senha.</span>');return}
      saldo=d.itens;
    }catch(e){msg('<span class="err">Sem internet ou planilha indisponível. Para salvar é preciso internet. Suas alterações continuam guardadas neste celular.</span>');return}
    base=saldo;nomesDe(saldo);reconstruir(true);save();render();
    const inicial=Object.keys(saldo).length===0;
    const nm=Object.keys(saldo).filter(c=>saldo[c].qtd>0&&!tocados[c]).sort(porNome);
    if(!inicial&&nm.length){
      const lista=nm.slice(0,12).map(nome).join(', ')+(nm.length>12?' e mais '+(nm.length-12):'');
      const ok=await caixa({titulo:'Você não mexeu em '+plural(nm.length,'item','itens'),texto:lista+'. Eles serão salvos como estão. Se algum mudou, volte e ajuste.',ok:'Estão certos, continuar',cancelar:'Voltar e conferir'});
      if(!ok){msg('Confira os itens marcados como “sem alteração”. Toque em “está igual” quando estiver certo.');return}
    }
    comparar(saldo,inicial);
  };

  function comparar(saldo,inicial){
    const codes=Object.keys(cnt).filter(c=>cnt[c]>0||saldo[c]).sort(porNome);
    const rows=codes.map(c=>{const antes=saldo[c]?saldo[c].qtd:0;return{c,antes,agora:cnt[c],dif:num(cnt[c]-antes)}});
    const mud=rows.filter(r=>r.dif!==0);
    let ent=0,sai=0;rows.forEach(r=>{if(r.dif>0)ent+=r.dif;else if(r.dif<0)sai-=r.dif});
    const lab=r=>inicial?'<span class="mut">inicial</span>':r.dif>0?'<span class="ok">+'+fmt(r.dif)+' entrou</span>':'<span class="err">−'+fmt(Math.abs(r.dif))+' saiu</span>';
    $('cmp').innerHTML='<div class="card"><h2 style="margin-top:0">'+(inicial?'Primeira contagem':'Comparação com a última contagem')+'</h2>'+
      (inicial?'<p class="mut">Ainda não há estoque na planilha. Esta contagem será salva como estoque inicial.</p>':'<div class="tot"><span class="ok">Entrou: '+fmt(Math.round(ent*1000)/1000)+'</span><span class="err">Saiu: '+fmt(Math.round(sai*1000)/1000)+'</span></div>')+
      (inicial?rows:mud).map(r=>'<div class="item"><div class="info"><div class="nm">'+esc(nome(r.c))+'</div><div class="sub">'+esc((cat[r.c]&&cat[r.c].size)||'')+(inicial?'':' antes '+fmt(r.antes)+' · agora '+fmt(r.agora))+'</div></div><div class="dif">'+(inicial?fmt(r.agora)+' un.':lab(r))+'</div></div>').join('')+
      (!inicial&&!mud.length?'<p class="mut">Nenhuma alteração em relação à última contagem.</p>':'')+
      (!inicial&&mud.length&&rows.length>mud.length?'<div class="sub" style="margin-top:8px">'+(rows.length-mud.length===1?'1 item igual não aparece aqui.':(rows.length-mud.length)+' itens iguais não aparecem aqui.')+'</div>':'')+
      '<button class="b wide" id="conf">Confirmar e salvar na planilha</button></div>';
    $('conf').onclick=async()=>{
      const bt=$('conf');bt.disabled=true;bt.textContent='Salvando…';
      const itens=rows.map(r=>({codigo:r.c,nome:(cat[r.c]&&cat[r.c].name)||'',medida:(cat[r.c]&&cat[r.c].size)||'',qtd:r.agora}));
      try{
        const d=await apiPost({acao:'salvar',itens,zerarNaoLidos:false});
        if(d.ok){
          const nb={};Object.keys(saldo).forEach(c=>nb[c]=saldo[c]);
          itens.forEach(i=>nb[i.codigo]={nome:i.nome,medida:i.medida,qtd:i.qtd});
          base=nb;store.set(kU('ultimoSaldo'),{itens:nb,quando:agora()});
          cnt={};tocados={};reconstruir(false);save();render();$('cmp').innerHTML='';
          msg('<span class="ok">Salvo na planilha.</span> '+(d.inicial?'Estoque inicial registrado.':d.mov+' movimentações registradas.')+' A lista abaixo já é a base da próxima contagem.');
          window.scrollTo({top:0,behavior:'smooth'});
        }else{msg('<span class="err">A planilha recusou: '+esc(d.erro||'erro')+'</span>');bt.disabled=false;bt.textContent='Confirmar e salvar na planilha'}
      }catch(e){msg('<span class="err">Não consegui salvar. A lista continua aqui, tente de novo.</span>');bt.disabled=false;bt.textContent='Confirmar e salvar na planilha'}
    };
    $('cmp').scrollIntoView({behavior:'smooth'});
  }

  function parar(){
    if(timer){clearInterval(timer);timer=null}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    const v=$('v'),b=$('cam');if(v)v.style.display='none';if(b)b.textContent=TXT_CAM;
  }
  limpar=parar;
  $('cam').onclick=async()=>{
    if(stream){parar();return}
    if(!('BarcodeDetector' in window)){msg('<span class="err">Este navegador não lê código de barras. Use o Chrome no Android.</span>');return}
    det=det||new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
    catch(e){msg('<span class="err">A câmera não abriu. Permita o acesso à câmera no navegador e abra pelo link https.</span>');return}
    const v=$('v');v.srcObject=stream;v.style.display='block';await v.play();
    $('cam').textContent='Parar câmera';msg('Aponte para o produto…');
    timer=setInterval(async()=>{
      try{const r=await det.detect(v);
        if(r.length){const c=r[0].rawValue,now=Date.now();
          if(c!==lastCode||now-lastAt>1500){lastCode=c;lastAt=now;contar(c)}else lastAt=now}
      }catch(e){}
    },300);
  };
  render();
  carregar();
}

/* ===== Tabelas sincronizadas com a planilha (Documentos e Financeiro) ===== */
const tempo=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error('tempo')),ms))]);
function tabela(base,cols,cab,textCols,porUnid){
  if(porUnid===undefined)porUnid=true;
  const NOME=()=>porUnid&&U()!=='matriz'?base+' ('+U()+')':base;
  const K=()=>'tab:'+NOME();
  const L=()=>store.get(K(),[]);
  const T={
    busy:false,again:false,ok:false,
    nome:NOME,
    todos:()=>L().filter(r=>!r.apagado),
    salvar(r){const l=L();r.atu=Date.now();r.apagado=0;const i=l.findIndex(x=>x.id===r.id);if(i>=0)l[i]=r;else l.push(r);store.set(K(),l)},
    apagar(id){const l=L();const i=l.findIndex(x=>x.id===id);if(i>=0){l[i].apagado=1;l[i].atu=Date.now();store.set(K(),l)}},
    async sync(){
      if(T.busy){T.again=true;return T.ok}
      T.busy=true;
      const nm=NOME(),kk=K();
      try{
        const d=await tempo(apiGet({action:'tab_listar',nome:nm}),12000);
        if(!d.ok)throw new Error(d.erro==='ação'?'atualize o script da planilha':(d.erro||'erro'));
        const m={};
        (d.linhas||[]).forEach(a=>{const o={};cols.forEach((c,i)=>o[c]=a[i]===undefined?'':a[i]);o.atu=Number(o.atu)||0;o.apagado=Number(o.apagado)?1:0;if(o.id!=='')m[o.id]=o});
        store.get(kk,[]).forEach(o=>{const r=m[o.id];if(!r||o.atu>r.atu)m[o.id]=o});
        const todos=Object.keys(m).map(k=>m[k]);
        store.set(kk,todos);
        const r=await tempo(apiPost({acao:'tab_salvar',nome:nm,cols,cab,textCols,linhas:todos.map(o=>cols.map(c=>o[c]==null?'':o[c]))}),15000);
        if(!r.ok)throw new Error(r.erro||'erro');
        T.ok=true;T.erro='';
      }catch(e){T.ok=false;T.erro=e.message}
      T.busy=false;
      if(T.again){T.again=false;return T.sync()}
      return T.ok;
    }
  };
  return T;
}
async function marcaSync(T){
  const e=$('sy');if(e)e.textContent='Sincronizando…';
  const ok=await T.sync();
  const f=$('sy');
  if(f)f.innerHTML=ok?'<span class="ok">Sincronizado com a planilha.</span>':'<span class="err">Sem conexão com a planilha'+(T.erro==='atualize o script da planilha'?' (atualize o script)':'')+'.</span> Está salvo neste celular e será enviado na próxima vez.';
  return ok;
}

function docInfo(d){
  if(Number(d.nv))return{k:'n',txt:'Não vence',ord:2e9};
  if(!d.val)return{k:'s',txt:'Sem data de validade',ord:1e9};
  const n=Math.round((dIso(d.val)-dIso(hojeIso()))/864e5),av=Number(d.aviso)||30;
  if(n<0)return{k:'v',txt:'Vencido há '+plural(-n,'dia','dias'),ord:n};
  if(n===0)return{k:'a',txt:'Vence hoje',ord:0};
  if(n<=av)return{k:'a',txt:'Vence em '+plural(n,'dia','dias'),ord:n};
  return{k:'o',txt:'Em dia · até '+brD(d.val),ord:n};

/* ===== Financeiro ===== */
const FIN_CATS={
  entrada:['Mensalidades','Matrículas','Outras entradas'],
  saida:['Salários e encargos','Aluguel','Energia elétrica','Água','Internet e telefone','Alimentação','Material de limpeza','Material de atividades','Manutenção','Impostos e taxas','Outras saídas']
};
const FIN_FORMAS=[['','—'],['Pix','Pix'],['Dinheiro','Dinheiro'],['Cartão','Cartão'],['Transferência','Transferência'],['Boleto','Boleto']];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
/* as recorrências ficam na mesma aba Financeiro (tipo rec_e = entrada recorrente, rec_s = saída recorrente) */
const fin=tabela('Financeiro',['id','tipo','data','desc','cat','valor','forma','sit','obs','atu','apagado','dia','lim','per','ini','pulos','rec','comp','ativo'],
  ['ID','Tipo (entrada, saida, rec_e, rec_s)','Data','Descrição','Categoria','Valor (R$)','Forma de pagamento','Situação','Observações','Atualizado (código)','Apagado (1=sim)','Recorrência: dia habitual','Recorrência: dia limite','Recorrência: repete a cada (meses)','Recorrência: início (mês)','Recorrência: meses pulados','Veio da recorrência (código)','Competência (mês)','Recorrência ativa (1=sim)'],[1,2,3,4,5,7,8,9,15,16,17,18]);
let finMes=null,finFiltro='todos';
const nomeMes=ym=>MESES[Number(ym.slice(5,7))-1]+' de '+ym.slice(0,4);
const mudaMes=(ym,n)=>{const d=new Date(Number(ym.slice(0,4)),Number(ym.slice(5,7))-1+n,1);return isoD(d).slice(0,7)};
const finLanc=()=>fin.todos().filter(x=>x.tipo==='entrada'||x.tipo==='saida');
const finRec=()=>fin.todos().filter(x=>x.tipo==='rec_e'||x.tipo==='rec_s');
const diaMes=(ym,d)=>{const a=ym.split('-').map(Number),u=new Date(a[0],a[1],0).getDate();return ym+'-'+String(Math.min(Math.max(1,Number(d)||1),u)).padStart(2,'0')};
const difDias=(a,b)=>Math.round((dIso(a)-dIso(b))/864e5);
const dm=s=>brD(s).slice(0,5);

/* ocorrências das recorrências que ainda não foram baixadas (do início até a próxima prevista) */
function finOcorr(){
  const h=hojeIso(),ymH=h.slice(0,7),feitos={};
  finLanc().forEach(x=>{if(x.rec&&x.comp&&x.sit==='Realizado')feitos[x.rec+'|'+x.comp]=1});
  const out=[];
  finRec().filter(r=>String(r.ativo)!=='0').forEach(r=>{
    const per=Math.max(1,Number(r.per)||1),pul=String(r.pulos||'').split(',');
    let ym=r.ini||ymH,n=0;
    while(ym<ymH&&n++<600)ym=mudaMes(ym,per);
    if(ym===ymH&&!feitos[r.id+'|'+ym]&&pul.indexOf(ym)<0)out.push({r:r,ym:ym});
  });
  return out;
}
function ocInfo(o){
  const r=o.r,en=r.tipo==='rec_e',h=hojeIso();
  o.esp=diaMes(o.ym,r.dia);o.lim=diaMes(o.ym,Math.max(Number(r.lim)||0,Number(r.dia)||1));
  if(h>o.lim){const n=difDias(h,o.lim);return{k:'v',txt:'Atrasado há '+plural(n,'dia','dias')+' · limite '+dm(o.lim),ord:-1000-n}}
  if(h>=o.esp)return{k:'a',txt:(en?'Ainda não recebido':'Ainda não pago')+' · limite '+dm(o.lim),ord:difDias(o.lim,h)};
  const n=difDias(o.esp,h);
  if(n<=3)return{k:'a',txt:'Previsto em '+plural(n,'dia','dias')+' · '+dm(o.esp),ord:100+n};
  return{k:'o',txt:'Previsto para '+dm(o.esp),ord:1000+n};
}
function lancInfo(x){
  const en=x.tipo==='entrada';
  if(x.sit!=='Pendente')return{k:'o',feito:true,txt:en?'Recebido':'Pago',ord:5000};
  const n=difDias(x.data,hojeIso());
  if(n<0)return{k:'v',txt:'Atrasado há '+plural(-n,'dia','dias'),ord:-1000+n};
  if(n===0)return{k:'a',txt:en?'A receber hoje':'A pagar hoje',ord:0};
  if(n<=7)return{k:'a',txt:(en?'A receber':'A pagar')+' em '+plural(n,'dia','dias'),ord:n};
  return{k:'o',txt:(en?'A receber':'A pagar')+' em '+dm(x.data),ord:1000+n};
}
function finItens(){
  return finLanc().map(x=>({t:'l',x:x,i:lancInfo(x),data:x.data}))
    .concat(finOcorr().map(y=>{const i=ocInfo(y);return{t:'o',y:y,i:i,data:y.esp}}));
}
const precisa=it=>it.i.k==='v'||it.i.k==='a';
const noMesAtual=it=>String(it.data).slice(0,7)===hojeIso().slice(0,7);
const finAlertas=()=>finItens().filter(it=>precisa(it)&&noMesAtual(it)).length;

/* registrar que a ocorrência de uma recorrência foi recebida/paga */
async function baixarOc(rid,ym){
  const r=finRec().find(x=>x.id===rid);if(!r)return false;
  const ent=r.tipo==='rec_e';
  const q=await caixa({titulo:ent?'Registrar recebimento':'Registrar pagamento',sub:r.desc+' · '+nomeMes(ym),html:
    campo('valor','Valor (R$)',String(r.valor).replace('.',','),'text','inputmode="decimal"')+campo('data','Data',hojeIso(),'date')+selecao('forma','Forma de pagamento',FIN_FORMAS,r.forma),ok:ent?'Recebido':'Pago'});
  if(!q)return false;
  const valor=numBr(q.valor);
  if(!(valor>0)){await avisar('Falta o valor','Digite um valor maior que zero.');return false}
  const data=q.data||hojeIso();
  fin.salvar({id:'f'+uid(),tipo:ent?'entrada':'saida',data,desc:r.desc,cat:r.cat,valor,forma:q.forma,sit:'Realizado',obs:'',rec:r.id,comp:ym});

  return true;
}
async function pularOc(rid,ym){
  const r=finRec().find(x=>x.id===rid);if(!r)return false;

}

const slugUnid=n=>n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^clube\s*(de\s*)?terapia\s*-?\s*/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,20);

/* ---- sincronização com a planilha do Google ---- */
const agFila={
  vazia:()=>({profs:{},cons:{},delProfs:[],delCons:[]}),
  get(){const f=store.get(kU('agfila'),null);return f&&f.profs&&f.cons&&f.delProfs&&f.delCons?f:agFila.vazia()},
  set(f){store.set(kU('agfila'),f)},
  total(f){return Object.keys(f.profs).length+Object.keys(f.cons).length+f.delProfs.length+f.delCons.length},
  upProf(p){const f=agFila.get();f.profs[p.id]=p;f.delProfs=f.delProfs.filter(x=>x!==p.id);agFila.set(f)},
  upCons(c){const f=agFila.get();f.cons[c.id]=c;f.delCons=f.delCons.filter(x=>x!==c.id);agFila.set(f)},
  delProf(id){const f=agFila.get();delete f.profs[id];Object.keys(f.cons).forEach(k=>{if(f.cons[k].prof===id)delete f.cons[k]});if(f.delProfs.indexOf(id)<0)f.delProfs.push(id);agFila.set(f)},
  delCons(id){const f=agFila.get();delete f.cons[id];if(f.delCons.indexOf(id)<0)f.delCons.push(id);agFila.set(f)},
  /* devolve à fila o que não conseguiu ser enviado, sem desfazer alterações mais novas */
  junta(v){
    const f=agFila.get();
    Object.keys(v.profs).forEach(k=>{if(!f.profs[k]&&f.delProfs.indexOf(k)<0)f.profs[k]=v.profs[k]});
    Object.keys(v.cons).forEach(k=>{if(!f.cons[k]&&f.delCons.indexOf(k)<0&&f.delProfs.indexOf(v.cons[k].prof)<0)f.cons[k]=v.cons[k]});
    v.delProfs.forEach(k=>{if(f.delProfs.indexOf(k)<0&&!f.profs[k])f.delProfs.push(k)});
    v.delCons.forEach(k=>{if(f.delCons.indexOf(k)<0&&!f.cons[k])f.delCons.push(k)});
    agFila.set(f);
  }
};
const agPayProf=p=>({id:p.id,nome:p.nome,esp:p.esp||'',zap:p.zap||'',cor:p.cor||''});
const agPayCons=c=>({id:c.id,prof:c.prof,data:c.data,hora:c.hora,pac:c.pac||'',tel:c.tel||'',tipo:c.tipo||'particular',status:c.status||'agendada',obs:c.obs||''});
/* o que veio da planilha + o que ainda está esperando para ser enviado */
function agAplicaFila(g,f){
  return{
    profs:g.profs.filter(p=>f.delProfs.indexOf(p.id)<0&&!f.profs[p.id]).concat(Object.keys(f.profs).map(k=>f.profs[k])),
    cons:g.cons.filter(c=>f.delCons.indexOf(c.id)<0&&f.delProfs.indexOf(c.prof)<0&&!f.cons[c.id]).concat(Object.keys(f.cons).map(k=>f.cons[k]))
  };
}
let agBusy=false,agUltimo=0,agEstado={s:'nunca'};
const agPend=()=>agFila.total(agFila.get());
const agStatusHtml=()=>'<div class="agst" id="agst"></div>';
function agPinta(){
  const n=agPend(),e=agEstado;let t,c='';
  if(e.s==='sync')t='🔄 Sincronizando com a planilha…';
  else if(e.s==='semsenha')t='☁️ Toque aqui para ligar à planilha (senha)';
  else if(e.s==='erro'){
    c='err';
    if(e.m==='senha')t='⚠️ Senha da planilha incorreta · toque para corrigir';
    else if(e.m==='acao')t='⚠️ O script da planilha ainda não tem as agendas · atualize o script e toque aqui';
    else t='⚠️ Sem conexão com a planilha'+(n?' · '+plural(n,'alteração pendente','alterações pendentes'):'')+' · toque para tentar de novo';
  }
  else if(n)t='⏳ '+plural(n,'alteração','alterações')+' para enviar · toque para sincronizar';
  else if(e.s==='ok'){t='☁️ Sincronizado com a planilha às '+e.t;c='ok'}
  else t='☁️ Toque para sincronizar com a planilha';
  document.querySelectorAll('.agst').forEach(el=>{el.textContent=t;el.className='agst '+c;el.onclick=agToque});
}
function agToque(){
  if(agEstado.s==='erro'&&agEstado.m==='senha')cfg(true).then(c=>{if(c)agSync(true)});
  else agSync(true);
}
async function agSync(manual){
  if(agBusy)return false;
  const c0=store.get('planilha',{});
  if(!c0.token&&!manual){agEstado={s:'semsenha'};agPinta();return false}
  agBusy=true;agEstado={s:'sync'};agPinta();
  let ok=false,mudou=false,msg='';
  try{
    if(!store.get(kU('agsync2'),0)){
      /* primeira vez: envia para a planilha o que já existe neste celular */
      const l=ag.get();l.profs.forEach(p=>agFila.upProf(p));l.cons.forEach(c=>agFila.upCons(c));
    }
    const f=agFila.get();
    if(agFila.total(f)){
      agFila.set(agFila.vazia());
      try{
        const r=await apiPost({acao:'ag_lote',profs:Object.keys(f.profs).map(k=>agPayProf(f.profs[k])),cons:Object.keys(f.cons).map(k=>agPayCons(f.cons[k])),delProfs:f.delProfs,delCons:f.delCons});
        if(!r.ok)throw new Error(r.erro||'erro');
      }catch(e){agFila.junta(f);throw e}
    }
    const g=await apiGet({action:'ag_listar'});
    if(!g.ok)throw new Error(g.erro||'erro');
    const novo=agAplicaFila({profs:g.profs||[],cons:g.cons||[]},agFila.get());
    mudou=JSON.stringify(novo)!==JSON.stringify(ag.get());
    ag.set(novo);store.set(kU('agsync2'),Date.now());
    ok=true;
  }catch(e){
    msg=String(e&&e.message||'');
    if(msg==='ação'||/forEach|undefined|null/.test(msg))msg='acao';
  }
  agBusy=false;agUltimo=Date.now();
  if(ok){const t=new Date();agEstado={s:'ok',t:String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}}
  else agEstado={s:'erro',m:msg};
  agPinta();
  if(ok&&mudou&&agRe)agRe();
  if(ok&&agPend())setTimeout(()=>agSync(),300);
  return ok;
}
function agIniciar(re){
  agRe=re;agPinta();
  if(agPend()||!store.get(kU('agsync2'),0)||Date.now()-agUltimo>30000)agSync();
}
setInterval(()=>{if(agRe&&!document.hidden)agSync()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&agRe)agSync()});

/* ---- dia (de um profissional ou de todos) ---- */
function abrirDia(pid,data){
  const d=ag.get(),p=pid?d.profs.find(x=>x.id===pid):null;

  const seg=somaDias(data,-((dIso(data).getDay()+6)%7)),h=hojeIso();

      '<div class="ai"><div class="nm">'+esc(c.pac||'Sem nome')+'</div><div class="sub">'+(p?'':esc(pr.nome)+' · ')+esc(tipo)+'</div>'+
      '<div class="chips"><span class="ch" style="background:'+st[1]+'">'+st[0]+'</span></div></div></button>';
  }).join('');
  const ativas=lista.filter(ativa).length;
  telaModulo(p?p.nome:'Agenda geral',
    (p&&p.esp?'<div class="sub" style="margin:-8px 0 12px">'+esc(p.esp)+'</div>':'')+
    '<div class="wk">'+sem+'</div>'+
    '<div class="dn"><button class="nv" id="dp">‹</button><div class="dt">'+dataLonga(data)+(data===h?' · hoje':'')+'<div class="sub" style="font-weight:600">'+plural(ativas,'consulta','consultas')+'</div></div><button class="nv" id="dx">›</button></div>'+
    '<div class="row" style="margin-bottom:12px"><button class="b alt" id="dh" style="flex:1;padding:11px">Hoje</button><button class="b alt" id="dg" style="flex:1;padding:11px">Ir para data</button></div>'+

    ()=>refazer(abrirAgendas));
  const ir=s=>refazer(()=>abrirDia(pid,s));

  $('dg').onclick=async()=>{const r=await caixa({titulo:'Ir para data',html:campo('d','Data',data,'date'),ok:'Ir'});if(r&&r.d)ir(r.d)};
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{
    const c=ag.get().cons.find(x=>x.id===b.dataset.c);if(!c)return;

/* ---- formulário de consulta (nova ou existente) ---- */
async function formConsulta(c,pidTela,data,pre){
  const d=ag.get(),profId=c?c.prof:pidTela,p0=d.profs.find(x=>x.id===profId);
  if(!p0)return null;
  const v=pre||c||{pac:'',tel:'',data:data,hora:'',tipo:'particular',status:'agendada',obs:''};
  const html=
    campo('pac','Paciente (nome e parte do sobrenome)',v.pac,'text','placeholder="Ex: Maria Sil." autocapitalize="words"')+
    campo('tel','Telefone / WhatsApp',v.tel,'tel','inputmode="tel" placeholder="(85) 99999-9999"')+
    campo('data','Dia da consulta',v.data,'date')+
    campo('hora','Horário da consulta',v.hora,'time')+
    '<div class="r2">'+selecao('tipo','Tipo',Object.keys(AG_TIPOS).map(k=>[k,AG_TIPOS[k]]),v.tipo)+selecao('status','Situação',Object.keys(AG_STATUS).map(k=>[k,AG_STATUS[k][0]]),v.status)+'</div>'+
    '<label class="fl">Observações<textarea data-f="obs" rows="2">'+esc(v.obs||'')+'</textarea></label>'+
    (c?'<div class="acs"><button type="button" class="b alt" data-a="zap">WhatsApp</button><button type="button" class="b alt" data-a="del" style="color:var(--err);border-color:var(--err)">Excluir</button></div>':'');
  const r=await caixa({titulo:c?'Consulta':'Agendar consulta',sub:p0.nome,html:html,ok:'Salvar',semEnter:true,semFoco:!!c,
    acao:(a,ler,fim)=>{
      if(a==='zap'){const x=ler();if(!zap({pac:x.pac,tel:x.tel,data:x.data,hora:x.hora},p0))toast('Informe um telefone com DDD.')}
      else if(a==='del'){confirmar('Excluir consulta?','Essa ação não pode ser desfeita.','Excluir').then(ok=>{if(ok)fim({__del:1})})}
    }});
  if(!r)return null;
  if(r.__del){const dd=ag.get();dd.cons=dd.cons.filter(x=>x.id!==c.id);ag.set(dd);agFila.delCons(c.id);agSync();toast('Consulta excluída.');return true}
  const nova={id:c?c.id:uid(),prof:profId,data:r.data,hora:(r.hora||'').trim(),pac:r.pac.trim(),tel:r.tel.trim(),tipo:r.tipo,status:r.status,obs:r.obs.trim()};
  if(!nova.pac){await avisar('Falta o nome','Digite o nome do paciente.');return formConsulta(c,pidTela,data,nova)}
  if(!nova.data){await avisar('Falta o dia','Escolha o dia da consulta.');return formConsulta(c,pidTela,data,nova)}
  if(!nova.hora){await avisar('Falta o horário','Escolha o horário da consulta.');return formConsulta(c,pidTela,data,nova)}
  const dd=ag.get();
  if(ativa(nova)){
    const choque=dd.cons.find(x=>x.id!==nova.id&&x.prof===nova.prof&&x.data===nova.data&&ativa(x)&&x.hora===nova.hora);
    if(choque&&!(await confirmar('Horário ocupado','Já existe consulta de '+(choque.pac||'outro paciente')+' às '+choque.hora+'. Agendar mesmo assim?','Agendar mesmo assim')))
      return formConsulta(c,pidTela,data,nova);
  }
  dd.cons=dd.cons.filter(x=>x.id!==nova.id).concat(nova);ag.set(dd);agFila.upCons(nova);agSync();
  toast('Consulta salva.');
  return nova;
}

/* ---- formulário de agenda do profissional ---- */
async function formProf(p,pre){
  const d=ag.get();
  const cores=Object.keys(AG_CORES);
  const v=pre||(p?{nome:p.nome,esp:p.esp,zap:p.zap||'',cor:p.cor}:{nome:'',esp:'',zap:'',cor:AG_CORES[cores[d.profs.length%cores.length]]});
  const corNome=cores.find(k=>AG_CORES[k]===v.cor)||'Azul';
  const html=
    campo('nome','Nome do profissional',v.nome,'text','placeholder="Ex: Dra. Ana" autocapitalize="words"')+
    campo('esp','Especialidade',v.esp,'text','list="esps" placeholder="Ex: Geriatra"')+
    '<datalist id="esps"><option value="Psiquiatra"><option value="Psicólogo(a)"><option value="Geriatra"></datalist>'+
    campo('zap','WhatsApp do profissional',v.zap||'','tel','inputmode="tel" placeholder="(85) 99999-9999"')+
    selecao('cor','Cor da agenda',cores.map(k=>[k,k]),corNome)+
    (p?'<div class="acs"><button type="button" class="b alt" data-a="del" style="color:var(--err);border-color:var(--err)">Excluir esta agenda</button></div>':'');
  const r=await caixa({titulo:p?'Editar agenda':'Nova agenda',html:html,ok:'Salvar',semEnter:true,semFoco:!!p,
    acao:(a,ler,fim)=>{
      if(a==='del'){const n=ag.get().cons.filter(x=>x.prof===p.id).length;
        confirmar('Excluir agenda?','Isso apaga também '+plural(n,'consulta','consultas')+' desta agenda. Não dá para desfazer.','Excluir').then(ok=>{if(ok)fim({__del:1})})}
    }});
  if(!r)return null;
  const dd=ag.get();
  if(r.__del){dd.profs=dd.profs.filter(x=>x.id!==p.id);dd.cons=dd.cons.filter(x=>x.prof!==p.id);ag.set(dd);agFila.delProf(p.id);agSync();toast('Agenda excluída.');return 'excluida'}
  const volta={nome:r.nome,esp:r.esp,zap:r.zap,cor:AG_CORES[r.cor]||'#1760c4'};
  if(!r.nome.trim()){await avisar('Falta o nome','Digite o nome do profissional.');return formProf(p,volta)}
  const novo={id:p?p.id:uid(),nome:r.nome.trim(),esp:r.esp.trim(),zap:r.zap.trim(),cor:volta.cor};
  dd.profs=p?dd.profs.map(x=>x.id===p.id?novo:x):dd.profs.concat(novo);
  ag.set(dd);agFila.upProf(novo);agSync();toast(p?'Agenda atualizada.':'Agenda criada.');
  return novo;
}

/* ---- enviar a agenda semanal ao profissional (WhatsApp) ---- */
const AG_DIASX=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const zapNum=t=>{let n=String(t||'').replace(/\D/g,'');if(n.length<10)return '';if(n.length<=11)n='55'+n;return n};
const agSemIni=b=>somaDias(b,-((dIso(b).getDay()+6)%7));
const rotSem=ini=>brD(ini).slice(0,5)+' a '+brD(somaDias(ini,6)).slice(0,5);
function agMensagem(p,ini,assin){
  const d=ag.get(),fim=somaDias(ini,6),hr=new Date().getHours();
  const sau=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';
  let total=0;const blocos=[];
  for(let i=0;i<7;i++){
    const dia=somaDias(ini,i),w=dIso(dia).getDay();
    const l=d.cons.filter(c=>c.prof===p.id&&c.data===dia&&ativa(c)).sort((a,b)=>a.hora.localeCompare(b.hora));
    if(!l.length)continue;
    total+=l.length;
    blocos.push('*'+AG_DIASX[w]+', '+brD(dia).slice(0,5)+'*\n'+l.map(c=>'• '+c.hora+' – '+(c.pac||'Sem nome')).join('\n'));
  }
  return sau+', '+p.nome+'!\n\nSegue a sua agenda de atendimentos referente à semana de '+brD(ini).slice(0,5)+' a '+brD(fim).slice(0,5)+':\n\n'+
    (blocos.length?blocos.join('\n\n'):'Não há consultas agendadas neste período.')+
    '\n\n*Total da semana: '+plural(total,'consulta','consultas')+'*\n\nQualquer ajuste ou dúvida, fico à disposição.\n\n'+
    (assin?'Atenciosamente,\n'+assin:'Atenciosamente.');
}
async function enviarSemana(pid,base,pre){
  const d=ag.get(),p=d.profs.find(x=>x.id===pid);if(!p)return;
  const h=hojeIso(),atual=agSemIni(h),prox=somaDias(atual,7),tela=agSemIni(base);
  const opc=[[atual,'Esta · '+rotSem(atual)],[prox,'Próxima · '+rotSem(prox)]];
  if(tela!==atual&&tela!==prox)opc.unshift([tela,'Exibida · '+rotSem(tela)]);
  const sem=pre?pre.sem:tela,assin0=pre?pre.assin:store.get('agassin','');
  const msg0=pre?pre.msg:agMensagem(p,sem,assin0);
  const html=selecao('sem','Semana',opc,sem)+
    campo('zap','WhatsApp do profissional',pre?pre.zap:(p.zap||''),'tel','inputmode="tel" placeholder="(85) 99999-9999"')+
    campo('assin','Assinatura (seu nome e função)',assin0,'text','placeholder="Ex: Carlos Barreto – Administrativo"')+
    '<label class="fl">Mensagem (você pode editar antes de enviar)<textarea data-f="msg" rows="11">'+esc(msg0)+'</textarea></label>'+
    '<div class="acs"><button type="button" class="b alt" data-a="copiar">Copiar mensagem</button></div>';
  const r=await caixa({titulo:'Enviar agenda da semana',sub:p.nome,html:html,ok:'Enviar no WhatsApp',semEnter:true,semFoco:true,
    mudou:(f,ov)=>{
      if(f!=='sem'&&f!=='assin')return;
      const q=k=>ov.querySelector('[data-f="'+k+'"]').value;
      ov.querySelector('[data-f="msg"]').value=agMensagem(p,q('sem'),q('assin').trim());
    },
    acao:(a,ler)=>{
      if(a!=='copiar')return;
      const t=ler().msg;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Mensagem copiada.')).catch(()=>toast('Não consegui copiar.'));
    }});
  if(!r)return;
  const n=zapNum(r.zap);
  if(!n){await avisar('Falta o WhatsApp','Digite o número do profissional com DDD, por exemplo (85) 99999-9999.');return enviarSemana(pid,base,{sem:r.sem,zap:r.zap,assin:r.assin,msg:r.msg})}
  store.set('agassin',r.assin.trim());
  if((p.zap||'')!==r.zap.trim()){const dd=ag.get();dd.profs=dd.profs.map(x=>x.id===pid?Object.assign({},x,{zap:r.zap.trim()}):x);ag.set(dd);agFila.upProf(dd.profs.find(x=>x.id===pid));agSync()}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(r.msg),'_blank');
}
function abrirEnvios(off){
  off=off||0;
  const d=ag.get(),ini=somaDias(agSemIni(hojeIso()),7*off);
  const linhas=d.profs.map(p=>{
    const n=d.cons.filter(c=>c.prof===p.id&&c.data>=ini&&c.data<=somaDias(ini,6)&&ativa(c)).length;
    return '<div class="card" style="border-left:6px solid '+p.cor+'"><div class="nm">'+esc(p.nome)+'</div><div class="sub">'+esc(p.esp||'')+(p.esp?' · ':'')+plural(n,'consulta','consultas')+'</div>'+
      '<div class="sub">'+(zapNum(p.zap)?'WhatsApp: '+esc(p.zap):'<span class="err">WhatsApp ainda não cadastrado</span>')+'</div>'+
      '<button class="b wide" data-e="'+p.id+'" style="margin-top:10px">Enviar agenda</button></div>';
  }).join('');
  telaModulo('Enviar agendas',
    '<div class="row" style="margin-bottom:12px"><button class="b'+(off?' alt':'')+'" id="e0" style="flex:1;padding:11px">Esta semana</button><button class="b'+(off?'':' alt')+'" id="e1" style="flex:1;padding:11px">Próxima semana</button></div>'+
    '<div class="info" style="margin-top:-2px">Semana de '+rotSem(ini)+'</div>'+
    (linhas||'<div class="card mut">Crie uma agenda para poder enviar.</div>'),()=>refazer(abrirAgendas));
  $('e0').onclick=()=>refazer(()=>abrirEnvios(0));
  $('e1').onclick=()=>refazer(()=>abrirEnvios(1));
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{await enviarSemana(b.dataset.e,ini);refazer(()=>abrirEnvios(off))});
}

/* ---- backup e exportação ---- */
function abrirBackupAg(){
  const d=ag.get();
  telaModulo('Backup e exportar',
    '<div class="card"><div class="sub">As agendas ficam na planilha do Google (abas Profissionais e Consultas) e também neste celular, para funcionar sem internet ('+plural(d.profs.length,'agenda','agendas')+', '+plural(d.cons.length,'consulta','consultas')+'). O backup em arquivo é uma segurança extra. Guarde-o em local seguro, pois tem dados de pacientes.</div>'+
    '<button class="b wide" id="bkd">Baixar backup (arquivo)</button>'+
    '<button class="b alt wide" id="bkr">Restaurar backup</button>'+
    '<input type="file" id="bkf" accept=".json,application/json" style="display:none"></div>'+
    '<div class="card"><div class="sub">Lista com todas as consultas para abrir no Excel.</div><button class="b wide" id="bkc">Exportar consultas (CSV)</button></div>',()=>refazer(abrirAgendas));
  const baixar=(nome,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove()};
  $('bkd').onclick=()=>baixar('backup-agendas-'+hojeIso()+'.json',new Blob([JSON.stringify(ag.get())],{type:'application/json'}));
  $('bkc').onclick=()=>{
    const dd=ag.get(),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',nomeP=id=>(dd.profs.find(x=>x.id===id)||{}).nome||'';
    const L=[['Data','Hora','Profissional','Paciente','Telefone','Tipo','Situação','Observações']].concat(
      dd.cons.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).map(c=>[brD(c.data),c.hora,nomeP(c.prof),c.pac,'="'+String(c.tel||'').replace(/\D/g,'')+'"',AG_TIPOS[c.tipo]||c.tipo,(AG_STATUS[c.status]||[c.status])[0],c.obs||'']));
    baixar('consultas-'+hojeIso()+'.csv',new Blob(['\ufeff'+L.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  };
  $('bkr').onclick=()=>$('bkf').click();
  $('bkf').onchange=async e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    let novo;try{novo=JSON.parse(await f.text())}catch(x){}
    if(!novo||!Array.isArray(novo.profs)||!Array.isArray(novo.cons)){await avisar('Arquivo inválido','Esse arquivo não é um backup das agendas.');e.target.value='';return}
    if(await confirmar('Restaurar backup?','Isso junta '+plural(novo.profs.length,'agenda','agendas')+' e '+plural(novo.cons.length,'consulta','consultas')+' do arquivo com o que já existe. Se o código for o mesmo, vale o do arquivo.','Restaurar')){
      const at=ag.get(),m1={},m2={};
      at.profs.concat(novo.profs).forEach(x=>m1[x.id]=x);at.cons.concat(novo.cons).forEach(x=>m2[x.id]=x);
      ag.set({profs:Object.keys(m1).map(k=>m1[k]),cons:Object.keys(m2).map(k=>m2[k])});
      novo.profs.forEach(p=>agFila.upProf(p));novo.cons.forEach(c=>agFila.upCons(c));agSync();
      toast('Backup restaurado.');refazer(abrirBackupAg);
    }
    e.target.value='';
  };
}

function menuPeriodo(t,fn,volta){
  const f=p=>()=>fn(p,()=>menuPeriodo(t,fn,volta));
  menu(t,[{ic:'📅',t:'Semanal',f:f('semana')},{ic:'🗓️',t:'Mensal',f:f('mes')},{ic:'📆',t:'Anual',f:f('ano')}],volta);
}

const NOMEP={semana:'semanal',mes:'mensal',ano:'anual'};
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const brD=s=>String(s).split('-').reverse().join('/');
const msgErro=e=>e.message==='config'?'Digite a senha da planilha em Estoque, Configurações.':'Não consegui falar com a planilha ('+esc(e.message)+'). Confira a internet e a configuração.';
function periodo(p){
  const h=new Date();let d;
  if(p==='semana'){d=new Date(h);d.setDate(h.getDate()-((h.getDay()+6)%7))}
  else if(p==='mes')d=new Date(h.getFullYear(),h.getMonth(),1);
  else d=new Date(h.getFullYear(),0,1);
  return{de:isoD(d),ate:isoD(h)};
}
async function buscarRel(p){
  const q=periodo(p),r=await apiGet({action:'relatorio',de:q.de,ate:q.ate});
  if(!r.ok)throw new Error(r.erro||'erro');
  const ks=Object.keys(r.itens).sort((a,b)=>(r.itens[a].nome||a).localeCompare(r.itens[b].nome||b));
  const lin=ks.map(k=>{const i=r.itens[k];return{cod:k,nome:i.nome||k,medida:i.medida||'',e:i.entrou,s:i.saiu,sd:i.saldo}});
  return{de:q.de,ate:q.ate,lin,te:lin.reduce((a,l)=>a+l.e,0),ts:lin.reduce((a,l)=>a+l.s,0)};
}
const tabelaRel=R=>'<div class="tot"><span class="ok">Entrou: '+R.te+'</span><span class="err">Saiu: '+R.ts+'</span></div>'+
  '<table class="tb"><tr><th>Produto</th><th>Entrou</th><th>Saiu</th><th>Saldo</th></tr>'+
  R.lin.map(l=>'<tr><td>'+esc(l.nome+(l.medida?' ('+l.medida+')':''))+'</td><td>'+l.e+'</td><td>'+l.s+'</td><td>'+l.sd+'</td></tr>').join('')+'</table>';

async function verRelatorio(p,volta){
  telaModulo('Relatório '+NOMEP[p],'<div class="card" id="rel">Buscando…</div>',volta);
  try{
    const R=await buscarRel(p);
    if(!R.lin.length){$('rel').innerHTML='Sem movimentações de '+brD(R.de)+' a '+brD(R.ate)+'.';return}
    $('rel').innerHTML='<div class="sub" style="margin-bottom:8px">'+brD(R.de)+' a '+brD(R.ate)+'</div>'+tabelaRel(R)+'<button class="b wide" id="cp">Copiar ou enviar</button>';
    $('cp').onclick=()=>compartilhar('Relatório '+NOMEP[p]+' de estoque, '+brD(R.de)+' a '+brD(R.ate)+'\nEntrou: '+R.te+' | Saiu: '+R.ts+'\n'+R.lin.map(l=>l.nome+': entrou '+l.e+', saiu '+l.s+', saldo '+l.sd).join('\n'));
  }catch(e){$('rel').innerHTML='<span class="err">'+msgErro(e)+'</span>'}
}

async function baixarRelatorio(p,volta){
  telaModulo('Baixar relatório '+NOMEP[p],'<div class="card" id="rel">Buscando…</div>',volta);

        .concat(R.lin.map(l=>['="'+l.cod+'"',l.nome,l.medida,l.e,l.s,l.sd])).concat([[],['Total','','',R.te,R.ts,'']]);

  try{
    const d=await apiGet({action:'saldo'});
    if(!d.ok)throw new Error(d.erro||'erro');
    const ks=Object.keys(d.itens).filter(k=>d.itens[k].qtd>0).sort((a,b)=>(d.itens[a].nome||a).localeCompare(d.itens[b].nome||b));
    if(!ks.length){$('sd').textContent='Ainda não há estoque salvo. Faça a primeira contagem.';return}
    $('sd').innerHTML='<div class="tot"><span>Produtos: '+ks.length+'</span><span>Unidades: '+ks.reduce((s,k)=>s+d.itens[k].qtd,0)+'</span></div>'+
      '<div class="sub" style="margin-bottom:6px">Toque em “editar quantidade” para corrigir o estoque.</div>'+
      ks.map(k=>{const i=d.itens[k];return'<div class="item"><div class="info"><div class="nm">'+esc(i.nome||k)+'</div><div class="sub">'+esc(i.medida||'')+'</div><button class="ed" data-ed="'+k+'">editar quantidade</button></div><div class="qty"><b>'+i.qtd+'</b></div></div>'}).join('');
    $('sd').onclick=async e=>{
      const k=e.target.dataset.ed;if(!k)return;
      const i=d.itens[k];
      const r0=await caixa({titulo:'Editar quantidade',sub:(i.nome||k)+(i.medida?' · '+i.medida:''),
        html:'<label class="fl">Quantidade em estoque</label><div class="qs"><button type="button" class="b alt" data-st="-1">−</button><input data-f="qtd" inputmode="decimal" value="'+esc(i.qtd)+'"><button type="button" class="b alt" data-st="1">+</button></div>'+
        '<details><summary>Corrigir nome e medida</summary>'+campo('n','Nome do produto',i.nome||'')+campo('m','Medida (ex: 500 g)',i.medida||'')+'</details>',ok:'Salvar'});
      if(!r0)return;
      const qn=Number(String(r0.qtd).replace(',','.'));
      if(String(r0.qtd).trim()===''||!isFinite(qn)||qn<0){await avisar('Quantidade inválida','Digite um número igual ou maior que zero.');return}
      try{
        const r=await apiPost({acao:'ajustar',codigo:k,nome:r0.n.trim(),medida:r0.m.trim(),qtd:qn});
        if(r.ok){porVoltar=true;abrirSaldo();porVoltar=false;toast('Quantidade salva.')}
        else await avisar('A planilha recusou',(r.erro==='produto não encontrado'?'Produto não encontrado':(r.erro||'Erro'))+'. Se o erro for de ação, atualize o script.');
      }catch(err){await avisar('Não consegui salvar','Confira a internet e tente de novo.')}
    };
  }catch(e){$('sd').innerHTML='<span class="err">'+msgErro(e)+'</span>'}
}

async function abrirMov(){
  telaModulo('Movimentações','<div class="card" id="mv">Buscando…</div>',abrirEstoque);
  try{
    const d=await apiGet({action:'movimentos'});
    if(!d.ok)throw new Error(d.erro==='ação'?'atualize o script da planilha':(d.erro||'erro'));
    if(!d.itens.length){$('mv').textContent='Nenhuma movimentação ainda.';return}
    $('mv').innerHTML='<div class="sub" style="margin-bottom:6px">Últimas '+d.itens.length+' movimentações</div>'+d.itens.map(i=>{
      const t=i.tipo==='Inicial'?'<span class="mut">inicial '+i.depois+'</span>':i.dif>0?'<span class="ok">+'+i.dif+' entrou</span>':'<span class="err">'+i.dif+' saiu</span>';
      return'<div class="item"><div class="info"><div class="nm">'+esc(i.nome||i.codigo)+'</div><div class="sub">'+esc(String(i.data)+' '+String(i.hora))+'</div></div><div class="dif">'+t+'</div></div>'}).join('');
  }catch(e){$('mv').innerHTML='<span class="err">'+msgErro(e)+'</span>'}
}

function abrirConfig(){
  const c=store.get('planilha',{url:''});
  telaModulo('Configurações','<div class="card"><div class="sub">Planilha (endereço já incluído no app)</div><div class="nm" id="st">'+(c.token?'Senha salva neste celular':'Falta a senha (toque em Alterar senha)')+'</div>'+
    '<button class="b wide" id="alt">Alterar senha</button><button class="b alt wide" id="tst">Testar conexão</button><div id="rs" style="margin-top:10px;font-weight:600"></div></div>',abrirEstoque);
  $('alt').onclick=async()=>{const n=await cfg(true);if(n)$('st').textContent='Senha salva neste celular'};
  $('tst').onclick=async()=>{
    $('rs').textContent='Testando…';
    try{const d=await apiGet({action:'saldo'});
      $('rs').innerHTML=d.ok?'<span class="ok">Conectado. '+Object.keys(d.itens).length+' produtos no estoque.</span>':'<span class="err">A planilha recusou: '+esc(d.erro||'erro')+'. Confira a senha.</span>'}
    catch(e){$('rs').innerHTML='<span class="err">'+msgErro(e)+'</span>'}
  };
}

inicio();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
